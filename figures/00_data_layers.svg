<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Spatial transcriptomics data layers</title><desc id="desc">Expression matrix, spatial coordinates, tissue image, and metadata combine into an analysis object.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#40536d"/></marker><style>.h{font:700 26px Arial;fill:#14213d}.b{font:700 18px Arial;fill:#14213d}.t{font:15px Arial;fill:#40536d}.arr{stroke:#40536d;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="1200" height="560" rx="24" fill="#f7f9fc"/><text x="55" y="55" class="h">Four data layers create spatial context</text>
  <g transform="translate(60 110)"><rect width="230" height="145" rx="16" fill="#e8f3ff" stroke="#78a9df"/><text x="115" y="34" text-anchor="middle" class="b">Expression matrix</text><text x="115" y="68" text-anchor="middle" class="t">spots × genes</text><text x="115" y="96" text-anchor="middle" class="t">UMI counts or transformed</text><text x="115" y="122" text-anchor="middle" class="t">expression values</text></g>
  <g transform="translate(60 310)"><rect width="230" height="145" rx="16" fill="#eaf8ef" stroke="#6dbb88"/><text x="115" y="34" text-anchor="middle" class="b">Coordinates</text><text x="115" y="68" text-anchor="middle" class="t">one (x, y) pair per spot</text><text x="115" y="96" text-anchor="middle" class="t">connects expression</text><text x="115" y="122" text-anchor="middle" class="t">to tissue location</text></g>
  <g transform="translate(910 110)"><rect width="230" height="145" rx="16" fill="#fff4df" stroke="#e1a84b"/><text x="115" y="34" text-anchor="middle" class="b">Tissue image</text><text x="115" y="68" text-anchor="middle" class="t">histology and morphology</text><text x="115" y="96" text-anchor="middle" class="t">registered to the</text><text x="115" y="122" text-anchor="middle" class="t">capture coordinates</text></g>
  <g transform="translate(910 310)"><rect width="230" height="145" rx="16" fill="#f3ecff" stroke="#9671d1"/><text x="115" y="34" text-anchor="middle" class="b">Metadata</text><text x="115" y="68" text-anchor="middle" class="t">sample, condition, batch</text><text x="115" y="96" text-anchor="middle" class="t">QC, annotations, and</text><text x="115" y="122" text-anchor="middle" class="t">experimental design</text></g>
  <path d="M300 183 C400 183 400 245 470 245" class="arr"/><path d="M300 383 C400 383 400 305 470 305" class="arr"/><path d="M900 183 C800 183 800 245 730 245" class="arr"/><path d="M900 383 C800 383 800 305 730 305" class="arr"/>
  <rect x="470" y="190" width="260" height="170" rx="25" fill="#14213d"/><text x="600" y="235" text-anchor="middle" style="font:700 22px Arial;fill:white">Spatial analysis object</text><text x="600" y="276" text-anchor="middle" style="font:16px Arial;fill:#dce7f7">AnnData / SpatialData</text><text x="600" y="311" text-anchor="middle" style="font:15px Arial;fill:#dce7f7">keeps the layers aligned</text><text x="600" y="336" text-anchor="middle" style="font:15px Arial;fill:#dce7f7">for analysis and plotting</text>
  <text x="600" y="515" text-anchor="middle" style="font:700 17px Arial;fill:#40536d">Lose the alignment between layers, and the expression is no longer spatially interpretable.</text>
</svg>
